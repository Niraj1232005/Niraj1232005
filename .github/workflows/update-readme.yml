name: Update README
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# give the workflow explicit permissions (if you still rely on GITHUB_TOKEN in other steps)
permissions:
  contents: write
  actions: read

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make changes to README
        run: |
          # your readme update commands here (example)
          echo "Updated at $(date -u)" >> README.md
          git add README.md
          git commit -m "ci: update README timestamp" || echo "no changes to commit"

      - name: Push changes using PAT
        uses: ad-m/github-push-action@master
        with:
          # Use the PAT you saved in repo secrets (create GH_PAT first)
          github_token: ${{ secrets.GH_PAT }}
          branch: main
          force: false
