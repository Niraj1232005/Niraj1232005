name: Update README
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# give the workflow explicit permissions (if you still rely on GITHUB_TOKEN in other steps)
permissions:
  contents: write
  actions: read

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make changes to README
        run: |
          # your readme update commands here (example)
          echo "Updated at $(date -u)" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "ci: update README timestamp" || echo "no changes to commit"

      - name: Push changes using built-in token
        uses: ad-m/github-push-action@master
        with:
          # Use the built-in token so you don't need a PAT
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: false
