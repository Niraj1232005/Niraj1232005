name: Update README

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours (UTC)
  workflow_dispatch:

# Grant explicit write permission so commits/pushes succeed
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true   # allow git push with GITHUB_TOKEN
          fetch-depth: 0

      - name: Update README with latest activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: '⚡ Update README with latest activity'
          MAX_LINES: 10

      - name: Generate Snake (contribution graph)
        uses: Platane/snk@master
        with:
          github_user_name: Niraj1232005
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes (if any)
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: "⚡ Update README and generated assets"
          add: "dist README.md"
          push: true
